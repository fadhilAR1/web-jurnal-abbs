<VirtualHost *:80>
    ServerName sma-abbs-surakarta.local
    ServerAlias www.sma-abbs-surakarta.local
    ServerAdmin admin@sma-abbs-surakarta.local

    # Document root pointing to Laravel public folder
    DocumentRoot "C:\laragon\www\sma-abbs-surakarta\public"

    # Directory configuration
    <Directory "C:\laragon\www\sma-abbs-surakarta\public">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted

        # Laravel rewrite rules
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Ignore real files and directories
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d

            # Rewrite all requests to index.php
            RewriteRule ^(.*)$ index.php [L]
        </IfModule>
    </Directory>

    # Logging
    ErrorLog "C:\laragon\logs\sma-abbs-surakarta-error.log"
    CustomLog "C:\laragon\logs\sma-abbs-surakarta-access.log" combined

    # Performance
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType text/javascript "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
    </IfModule>

    # Gzip compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

</VirtualHost>
